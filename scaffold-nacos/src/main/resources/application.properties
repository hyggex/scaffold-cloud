# ========== Spring Boot 基本配置 ==========
server.servlet.contextPath=/nacos
server.port=${NACOS_PORT:8848}
server.error.include-message=ALWAYS

spring.application.name=${NACOS_APP_NAME:scaffold-nacos}

# ========== 数据源配置 ==========
spring.sql.init.platform=${NACOS_DB_PLATFORM:mysql}
db.num=1
db.url.0=${NACOS_DB_URL:jdbc:mysql://localhost:3306/nacos?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
db.user.0=${NACOS_DB_USER:root}
db.password.0=${NACOS_DB_PASSWORD:root123}

# ========== Nacos 核心配置 ==========
nacos.plugin.datasource.log.enabled=true
nacos.naming.empty-service.auto-clean=true
nacos.naming.empty-service.clean.initial-delay-ms=50000
nacos.naming.empty-service.clean.period-time-ms=30000

# ========== 认证与安全 ==========
nacos.security.ignore.urls=/,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-ui/public/**,/v1/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**
nacos.core.auth.system.type=nacos
nacos.core.auth.enabled=${NACOS_AUTH_ENABLED:false}
nacos.core.auth.caching.enabled=true
nacos.core.auth.enable.userAgentAuthWhite=false

# Token 配置
nacos.core.auth.plugin.nacos.token.cache.enable=false
nacos.core.auth.plugin.nacos.token.expire.seconds=${NACOS_TOKEN_EXPIRE:18000}
nacos.core.auth.plugin.nacos.token.secret.key=${NACOS_TOKEN_SECRET:SecretKey012345678901234567890123456789012345678901234567890123456789}

# ========== Actuator + Spring Boot Admin ==========
management.endpoints.web.exposure.include=*
management.metrics.export.elastic.enabled=false
management.metrics.export.influx.enabled=false

spring.boot.admin.client.url=${SPRING_BOOT_ADMIN_URL:http://localhost:9100}
spring.boot.admin.client.username=${SPRING_BOOT_ADMIN_USER:hyh}
spring.boot.admin.client.password=${SPRING_BOOT_ADMIN_PASSWORD:123456}
spring.boot.admin.client.instance.service-host-type=IP
spring.boot.admin.client.instance.metadata.username=${spring.boot.admin.client.username}
spring.boot.admin.client.instance.metadata.userpassword=${spring.boot.admin.client.password}

# ========== Istio ==========
nacos.istio.mcp.server.enabled=false

# =========== Core ==========
nacos.core.auth.server.identity.key=${NACOS_IDENTITY_KEY:scaffold-vue-plus-key}
nacos.core.auth.server.identity.value=${NACOS_IDENTITY_VALUE:scaffold-vue-plus-value}
