server:
  port: 8082

spring:
  application:
    name: scaffold-resource
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # 数据源配置（需配合 Nacos 或本地 bootstrap.yml）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:scaffold}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      web-stat-filter:
        enabled: true
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: druid123
        allow: ""
        reset-enable: false

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.scaffold.resource.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# XSS 攻击防护配置
scaffold:
  security:
    xss:
      enabled: true
      mode: escape
      exclude-urls:
        - /auth/login
        - /auth/logout

# MinIO 对象存储配置
oss:
  minio:
    enabled: true
    endpoint: ${MINIO_ENDPOINT:127.0.0.1:9000}
    domain: ${MINIO_DOMAIN:}
    bucket-name: ${MINIO_BUCKET:scaffold}
    prefix: ${MINIO_PREFIX:uploads}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:admin123}
    is-https: ${MINIO_IS_HTTPS:N}
    access-policy: ${MINIO_ACCESS_POLICY:1}
    region: ${MINIO_REGION:}

# 日志配置
logging:
  level:
    com.scaffold: info
    com.baomidou.mybatisplus: warn

# =============================================================
# Knife4j / Swagger3 API 文档配置
# 访问地址：http://localhost:8082/doc.html
# =============================================================
knife4j:
  enable: true
  basic:
    enable: false
    username: admin
    password: admin123
  setting:
    language: zh_cn
    footer-enabled: true
    footer: Scaffold 微服务框架
    doc-title: 文件服务 API 文档

springdoc:
  api-docs:
    enabled: true
    title: 文件服务 API 接口文档
    description: MinIO 对象存储文件上传下载服务接口文档
    version: 1.0.0
  swagger-ui:
    enabled: true
    display-request-duration: true
