# Scaffold 基础设施服务
# 启动：docker-compose up -d
# 停止：docker-compose down
# 查看日志：docker-compose logs -f

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: scaffold-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: scaffold
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./script/sql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - scaffold-net

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: scaffold-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - scaffold-net

  # MinIO 对象存储
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: scaffold-minio
    ports:
      - "9000:9000"    # API 端口
      - "9001:9001"    # 控制台端口
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - scaffold-net

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  scaffold-net:
    driver: bridge
